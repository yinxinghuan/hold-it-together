<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  .p {
    width: 1024px; height: 1024px; position: relative;
    background: radial-gradient(120% 85% at 50% 0%, #232330 0%, #15151c 68%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #fff; overflow: hidden;
  }
  /* title block — kept in the TOP third */
  .head { padding-top: 64px; text-align: center; position: relative; z-index: 3; }
  .title {
    font-size: 116px; font-weight: 900; letter-spacing: 2px; line-height: .96;
    text-transform: uppercase; text-shadow: 0 6px 30px rgba(0,0,0,.55);
  }
  .en {
    margin-top: 22px; font-size: 33px; font-weight: 800; letter-spacing: 6px;
    color: #5ad1c7; text-transform: uppercase;
  }
  .tag {
    margin-top: 13px; font-size: 24px; font-weight: 600; letter-spacing: 2px;
    color: #9a9aa8;
  }
  /* the teetering tower, centered */
  .tower {
    position: absolute; left: 0; right: 0; bottom: 70px;
    display: flex; flex-direction: column; align-items: center;
  }
  .blk {
    height: 70px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: #20202a;
    box-shadow: 0 7px 16px rgba(0,0,0,.4);
    position: relative; margin-top: -2px;
  }
  .blk::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 38%;
    background: rgba(255,255,255,.18); border-radius: 11px 11px 0 0;
  }
  .pedestal {
    width: 320px; height: 54px; border-radius: 13px; margin-top: 6px;
    background: #3a3a48; box-shadow: 0 8px 20px rgba(0,0,0,.5);
    position: relative;
  }
  .pedestal::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26%;
    background: rgba(255,255,255,.08); border-radius: 13px 13px 0 0;
  }
</style>
</head>
<body>
  <div class="p">
    <div class="head">
      <div class="title">Hold It<br/>Together</div>
      <div class="en">a burnout survival sim</div>
      <div class="tag">stack the stress &mdash; don't let it topple</div>
    </div>
    <div class="tower">
      <div class="blk" style="width:300px; background:#c9a7ff; transform:rotate(-7deg) translateX(34px);">Mom Calls</div>
      <div class="blk" style="width:250px; background:#f0b341; transform:rotate(4deg) translateX(-20px);">Overtime</div>
      <div class="blk" style="width:330px; background:#ffd24a; transform:rotate(-3deg) translateX(16px);">Married Yet?</div>
      <div class="blk" style="width:280px; background:#ff7a7a; transform:rotate(3deg) translateX(-14px);">Deadline</div>
      <div class="blk" style="width:300px; background:#8ad0ff; transform:rotate(-2deg) translateX(8px);">Credit Card</div>
      <div class="blk" style="width:230px; background:#5ad1c7; transform:rotate(1deg);">Rent</div>
      <div class="blk" style="width:310px; background:#9ccf8e;">Rat Race</div>
      <div class="pedestal"></div>
    </div>
  </div>
</body>
</html>
